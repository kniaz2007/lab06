name: CI with CPack

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential rpm

      - name: Configure
        run: cmake -H. -B_build

      - name: Build
        run: cmake --build _build

      - name: Run tests (if BUILD_TESTS enabled)
        run: |
          cd _build
          ctest --output-on-failure || true

      - name: Create packages (only on tags)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd _build
          cpack -G TGZ
          cpack -G DEB
          cpack -G RPM || true   # RPM может не собраться без rpmbuild, но не страшно

      - name: Upload packages to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            _build/*.tar.gz
            _build/*.deb
            _build/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
